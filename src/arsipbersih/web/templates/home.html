{% extends "base.html" %}
{% block title %}Beranda - ArsipBersih{% endblock %}
{% block content %}
<header class="home-head">
  <h1 class="home-root" title="{{ root }}">{{ root }}</h1>
  <p class="home-sub muted"><span id="last-scan">&nbsp;</span> · <button id="root-toggle" class="btn btn-ghost home-link" type="button" aria-expanded="false" aria-controls="root-form">Ganti folder</button></p>
  <form id="root-form" class="home-rootform" hidden>
    <input id="root-input" type="text" value="{{ root }}" aria-label="Path folder kerja">
    <button type="submit" class="btn btn-secondary">Ganti</button>
  </form>
  <p id="root-msg" class="muted" role="status"></p>
</header>
<p id="source-warning" class="home-alert" role="alert" hidden></p>
<ul id="warnings" class="home-warnings"></ul>
<p id="scan-announce" class="sr-only" role="status" aria-live="polite"></p>
<ol id="steps" class="home-steps" aria-label="Langkah kerja"></ol>
<dl id="summary" class="home-summary"></dl>
<footer class="home-status">
  <p id="tools-line"></p>
  <p class="muted">Offline · 127.0.0.1</p>
  <details class="home-versions"><summary>Versi alat</summary><ul id="tools"></ul></details>
</footer>
{% endblock %}
{% block scripts %}<script type="module" src="/static/pages/home.js"></script>{% endblock %}
